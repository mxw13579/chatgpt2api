name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Only main updates latest; version tags and other manual branches do not.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chatgpt2api
          cache-to: type=gha,mode=max,scope=chatgpt2api

      # A repository-scoped credential may not have read:packages. Version
      # releases also provide a short-lived archive for verified offline rollout.
      - name: Export amd64 deployment archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p deployment-image
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "$image"
          printf '%s\n' "${IMAGE_NAME}@${IMAGE_DIGEST}" > deployment-image/registry-digest.txt
          printf '%s\n' "$GITHUB_SHA" > deployment-image/revision.txt
          docker save "$image" | gzip -1 > deployment-image/image.tar.gz
          # containerd's inspect ID can be an OCI index, while classic Docker
          # reports the config digest. Export the portable config digest.
          python -c 'import hashlib,json,tarfile; t=tarfile.open("deployment-image/image.tar.gz","r:gz"); c=json.load(t.extractfile("manifest.json"))[0]["Config"]; print("sha256:"+hashlib.sha256(t.extractfile(c).read()).hexdigest()); t.close()' > deployment-image/image-id.txt
          (cd deployment-image && sha256sum image.tar.gz > SHA256SUMS)

      - name: Upload amd64 deployment archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: deployment-image-amd64
          path: deployment-image/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Write image summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Published Docker images\n\n~~~text\n%s\n~~~\n' "$IMAGE_TAGS"
            printf '\n### Pinned image reference\n\n~~~text\n%s@%s\n~~~\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
